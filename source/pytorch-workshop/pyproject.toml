[project]
name = "pytorch-workshop"
description = ""
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENCE"}
authors = [{name = "Alessandro Conti", email = "alessandro.conti.97@gmail.com"}]
classifiers = [
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
  "beautifulsoup4>=4,<5",
  "fairscale>=0,<1",
  "faiss-cpu>=1,<2",
  "fastapi>=0,<1",
  "flair>=0,<1",
  "inflect>=7,<8",
  "httpx>=0,<1",
  "langchain-anthropic>=0,<1",
  "langchain-community>=0,<1",
  "langchain-core>=0,<1",
  "langchain_experimental>=0,<1",
  "langchain-google-genai>=2,<3",
  "langchain-openai>=0,<1",
  "langgraph>=0,<1",
  "langgraph-checkpoint-sqlite>=2,<3",
  "langsmith>=0,<1",
  "matplotlib>=3,<4",
  "nltk>=3,<4",
  "numexpr>=2,<3",
  "pandas>=2,<3",
  "pillow>=11,<12",
  "pyarrow>=20,<21",
  "pydantic>=2,<3",
  "pydantic_settings>=2,<3",
  "python-dotenv>=1,<2",
  "ram@git+https://github.com/xinyu1205/recognize-anything.git",
  "scikit-learn>=1,<2",
  "timm>=1,<2",
  "torch>=2,<3",
  "torchvision>=0,<1",
  "transformers>=4,<5",
  "uvicorn>=0,<1",
]

[dependency-groups]
agents = [
  "beautifulsoup4>=4,<5",
  "langchain-community>=0,<1",
  "langchain-core>=0,<1",
  "langchain_experimental>=0,<1",
  "langgraph>=0,<1",
  "numexpr>=2,<3",
]
client = [
  "httpx>=0,<1",
  "langchain-community>=0,<1",
  "langchain-core>=0,<1",
]
models = [
  "fairscale>=0,<1",
  "faiss-cpu>=1,<2",
  "flair>=0,<1",
  "inflect>=7,<8",
  "matplotlib>=3,<4",
  "nltk>=3,<4",
  "pandas>=2,<3",
  "pillow>=11,<12",
  "pyarrow>=20,<21",
  "ram@git+https://github.com/xinyu1205/recognize-anything.git",
  "scikit-learn>=1,<2",
  "timm>=1,<2",
  "torch>=2,<3",
  "torchvision>=0,<1",
  "transformers>=4,<5",
]
server = [
  "fastapi>=0,<1",
  "langchain-anthropic>=0,<1",
  "langchain-core>=0,<1",
  "langchain-google-genai>=2,<3",
  "langchain-openai>=0,<1",
  "langgraph-checkpoint-sqlite>=2,<3",
  "langsmith>=0,<1",
  "pydantic>=2,<3",
  "uvicorn>=0,<1",
]

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "pytest-asyncio", "pytest-env", "ruff"]

[project.urls]
Changelog = "https://github.com/altndrr/pytorch-workshop/blob/main/CHANGELOG.md"
Issues = "https://github.com/altndrr/pytorch-workshop/issues"
Repository = "https://github.com/altndrr/pytorch-workshop"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[tool.interrogate]
fail-under = 100
ignore-init-module = true
ignore-init-method = true
ignore-magic = true
ignore-module = true
ignore-nested-functions = true

[tool.pytest.ini_options]
cache_dir = "~/.cache/pytest"
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
minversion = "6.0"
testpaths = "tests/"
asyncio_default_fixture_loop_scope = "function"

[tool.pytest_env]
OPENAI_API_KEY = "sk-fake-openai-key"

[tool.ruff]
cache-dir = "~/.cache/ruff"
include = ["notebooks", "src", "tests", "./*.py"]
line-length = 99
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle
    "D",    # pydocstyle
    "I",    # isort
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "EXE",  # flake8-executable
    "G",    # flake8-logging-format
    "T20",  # flake9-print
    "SIM",  # flake8-simplify
]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "ANN101", "ANN002", "ANN003", "ANN102", "S101", "S112"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"examples/*.py" = ["E402", "T201"]
"src/agents/*.py" = ["UP"]
"*.ipynb" = ["E501", "I", "ANN", "S", "G004", "T20"]
"server.py" = ["E402", "T201"]

[tools.setuptools.dynamic]
version = {attr = "src.__version__"}
